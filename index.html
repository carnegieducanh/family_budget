<!doctype html>
<!-- Tắt kiểm tra chính tả cho mọi ô nhập: tên, ghi chú tiếng Việt lẫn tiếng Nhật bị gạch đỏ. -->
<html lang="vi" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Budget</title>
    <script>
      // Đặt theme và cỡ chữ đã chọn trước khi vẽ lần đầu để không nháy
      // (state/themeStore.ts, state/fontSizeStore.ts).
      try {
        var theme = localStorage.getItem('family-budget.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        var fontSize = localStorage.getItem('family-budget.font-size');
        if (fontSize === 'md' || fontSize === 'lg' || fontSize === 'xl')
          document.documentElement.dataset.fontSize = fontSize;
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
